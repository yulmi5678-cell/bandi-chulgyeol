<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>반디출결부</title><meta name="description" content="청소년 방과후활동서비스 출결 기록"><meta property="og:type" content="website"><meta property="og:title" content="반디방과후출결부"><meta property="og:description" content="청소년 방과후활동서비스 출결 기록"><meta property="og:url" content="https://yulmi5678-cell.github.io/bandi-chulgyeol/"><meta property="og:image" content="https://yulmi5678-cell.github.io/bandi-chulgyeol/icon-512.png"><meta name="theme-color" content="#2f67e0">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="반디출결부">
<style>
:root{--blue:#2563eb;--ink:#1e293b;--sub:#64748b;--line:#e2e8f0;--bg:#f1f5f9;--sky:#eaf2ff;--navy:#1e3a8a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;background:#fff;border:1px solid var(--line);border-radius:14px;font-weight:600;min-height:48px;padding:0 10px;color:#334155}
button:disabled{opacity:.55;cursor:default}button.p{background:var(--blue);color:#fff;border-color:var(--blue)}button.lite{background:#f0f7ff;color:var(--navy);border-color:#bfdbfe}button.pill{border-radius:999px}button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
input,select{background:#fff;border:1px solid #cbd5e1;border-radius:12px;min-height:48px;width:100%;min-width:0;padding:0 10px}
:focus-visible{outline:3px solid #93c5fd;outline-offset:1px}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;background:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line)}
.top img{width:46px;height:46px;border-radius:13px;border:1px solid var(--line);flex:none;object-fit:contain;background:#fff}.top .tt{flex:1;min-width:0}.ttl{font-size:19px;font-weight:700;line-height:1.25}.who{font-size:14px;color:var(--sub)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#58b585;margin-left:6px;vertical-align:1px}.dot.off{background:#d98a1f}
main{max-width:1120px;margin:auto;padding:12px 12px calc(28px + env(safe-area-inset-bottom))}
.cols{display:grid;gap:14px}@media(min-width:900px){.cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}}
.h{font-size:18px;font-weight:700;margin:14px 2px 8px}.h:first-child{margin-top:0}
.cg,.sum,.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.cg,.sum{margin-bottom:12px}
.cc,.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;min-width:0}.cn{font-size:15px;color:#475569;font-weight:600;overflow-wrap:anywhere}.cv{font-size:25px;font-weight:700;color:var(--blue);line-height:1.3}.cs{font-size:14px;color:var(--sub)}
.box .lb{font-size:15px;color:var(--sub)}.box .v{font-size:21px;font-weight:700}
.ban{display:block;width:100%;text-align:left;border-radius:14px;padding:12px;font-size:17px;font-weight:700;margin-bottom:8px;min-height:0;line-height:1.45;border:0}
.nav{display:grid;grid-template-columns:48px minmax(0,1fr) 48px;align-items:center;gap:6px;margin-bottom:8px}.nav button{padding:0;font-size:22px}.nav div{text-align:center;font-weight:700}
.dd{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin-bottom:10px}.dd button{padding:0;min-width:0;min-height:78px;font-size:16px;line-height:1.25;text-align:center}.dd small{display:block;font-size:12px;min-height:16px;font-weight:700}.dd b{display:block;font-weight:600;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.chips button{min-height:44px;padding:0 16px;border-radius:999px;font-size:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px;margin-bottom:9px}.card.done{background:#f8fafc}.rw{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:8px;align-items:center}.nm{font-size:21px;font-weight:700;overflow-wrap:anywhere}.meta{font-size:16px;color:var(--sub);line-height:1.5}.meta b{color:var(--blue)}
.more{width:100%;min-height:42px;margin-top:9px;font-size:15px;background:#f8fafc;border-color:#f1f5f9;color:#475569}
.pays{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:10px 0}.pays button{padding:0;min-width:0}
.field{display:grid;gap:4px;font-size:15px;color:var(--sub);margin-bottom:10px;min-width:0;font-weight:600}.wide{width:100%;margin-bottom:8px}
.err{font-size:15px;color:#c62828;margin:0 0 10px;font-weight:600}.ok{background:var(--sky);color:var(--navy);border-radius:12px;padding:11px;font-size:15px;line-height:1.5;margin-bottom:10px}.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:10px 14px;z-index:20;font-size:15px;max-width:92vw}
.log{border-top:1px solid #edf1f6;padding:10px 0}.log:first-child{border-top:0;padding-top:0}.lh{font-weight:600}.lg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 48px;gap:6px;margin-top:6px}.lg button{padding:0}
.group{font-size:14px;font-weight:700;color:var(--sub);margin:14px 4px 6px}.group:first-child{margin-top:0}.list{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}.it{display:grid;grid-template-columns:42px minmax(0,1fr) 14px;gap:12px;align-items:center;width:100%;min-height:64px;padding:9px 12px;border:0;border-top:1px solid #edf1f6;border-radius:0;text-align:left;font-size:18px;background:#fff}.it:first-child{border-top:0}.ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center}.ic svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.t3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.t3 select{border-radius:14px;padding:0 6px;font-weight:500}.ap{font-weight:700!important}.tf .ap option,.t3 option{font-weight:500}.sws{display:flex;flex-wrap:wrap;gap:10px}.sw{width:38px;height:38px;min-height:38px;border-radius:50%;border:0;padding:0}main.narrow{max-width:680px}
@media(min-width:900px){main{padding:22px 24px 40px}.cols{gap:32px}.cc,.box{padding:14px 16px}.cg,.sum{gap:12px;margin-bottom:18px}.dd{gap:8px;margin-bottom:14px}.h{margin:22px 2px 10px}.card{margin-bottom:12px;padding:16px}.chips{gap:8px;margin-bottom:14px}.nav{margin-bottom:12px}.ban{margin-bottom:12px}}
.qb{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;width:100%}.qb button,.qg{min-height:44px;font-size:15px;padding:0 8px;border-radius:14px;font-weight:600;min-width:0}.qo{background:#f59e0b!important;color:#fff!important;border-color:#f59e0b!important}.qs{background:#f0f9ff!important;color:#075985!important;border-color:#bae6fd!important}.qi{background:#eef2ff!important;color:#3730a3!important;border-color:#c7d2fe!important}.qv{background:#f5f3ff!important;color:#6d28d9!important;border-color:#ddd6fe!important}.qg{display:flex;align-items:center;justify-content:center;color:#fff;border-radius:999px}.pco{display:none}
@media(max-width:899px){.top{position:static;flex-wrap:wrap}}@media(min-width:900px){.qb{display:flex;width:auto;flex:none}.pco{display:block}.qb button,.qg{padding:0 14px}}
@media(min-width:900px){main{max-width:1680px;padding:22px 24px 40px}main.narrow{max-width:680px}.top{padding:10px max(24px,calc((100vw - 1680px)/2 + 24px))}}
@media(min-width:900px){.top .tt{flex:none;margin-right:12px}}
.qx{background:#ecfdf5!important;color:#15803d!important;border-color:#bbf7d0!important}.qk{background:#f8fafc!important;color:#475569!important}@media(min-width:900px){.qb{flex-wrap:wrap}}
.row{border-top:1px solid #edf1f6;padding:12px 0}.row:first-child{border-top:0;padding-top:0}.rh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.auth{max-width:440px;margin:7vh auto 0;padding:16px}.auth img{display:block;width:88px;height:88px;margin:0 auto 8px;object-fit:contain;border-radius:22px;background:#fff}.auth h1{text-align:center;font-size:23px;margin:0 0 14px}
.back{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:15;display:flex;align-items:center;justify-content:center;padding:16px}.back .card{width:min(420px,100%);margin:0}
</style></head><body><div id="root"></div><div id="tst"></div><script type="module" src="app.js?v=6"></script></body></html>
